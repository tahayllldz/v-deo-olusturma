<!DOCTYPE html>
<!--
  TEMPLATE E — Story / talking head (footage + designed captions)          20.0 s · 1080×1920
  Use for: founder POV, "KKTC İşletme Doktoru", behind the scenes, client Q&A answers.
  This is the format that keeps the account human — the voice is yours, the system frames it.

  A new video = one vertical clip + a content file. Nothing in this HTML needs editing:
    1. put the clip in beta-studio-reels/assets/ (e.g. assets/my-take.mp4, 9:16, ≤ 20 s)
    2. npm run sync   (copies assets/ into every project as system/assets/)
    3. content JSON: "videoSrc": "system/assets/my-take.mp4", "placeholderNote": ""
       and write captions against the clip's own timing.
    npx hyperframes render --variables-file content/example.json --output out.mp4
  (or from beta-studio-reels/:  npm run template -- e content/my-video.json)

  The clip's own sound is used (data-has-audio). Music sits low under the voice.
  Default footage (system/assets/demo/talking-head-placeholder.mp4) is a synthetic placeholder.

  Timeline (change data-duration + the T constants below together):
    hook 0–2.6 · lower third 2.8–6.6 · captions (from content) · payoff 16.4–18.4 · end card 18.4–20.0
  Captions: "2.8|First line||5.0|Second *line*" — seconds|text, each shown until the next one.
  Callouts (top of frame): "10.0|Label::Big line" — shown for 3 s.
  Text markup in every string:  *serif voice*  _accent_  ~red-pen underline~  ^red text^  | line break
-->
<html lang="tr" data-resolution="portrait" data-composition-variables="[
    {&quot;id&quot;: &quot;series&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Seri etiketi&quot;, &quot;default&quot;: &quot;KKTC İşletme Doktoru · 04&quot;},
    {&quot;id&quot;: &quot;hookVariant&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;label&quot;: &quot;Hook varyantı&quot;, &quot;default&quot;: &quot;A&quot;, &quot;options&quot;: [{&quot;value&quot;: &quot;A&quot;, &quot;label&quot;: &quot;A — problem önce&quot;}, {&quot;value&quot;: &quot;B&quot;, &quot;label&quot;: &quot;B — tartışmalı&quot;}]},
    {&quot;id&quot;: &quot;hookA&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Hook A&quot;, &quot;default&quot;: &quot;“Bize de|uygulama|~lazım mı?~”&quot;},
    {&quot;id&quot;: &quot;hookB&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Hook B&quot;, &quot;default&quot;: &quot;Uygulama|yaptırmadan önce|*bunu* dinleyin.&quot;},
    {&quot;id&quot;: &quot;videoSrc&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Video (system/assets/…)&quot;, &quot;default&quot;: &quot;system/assets/demo/talking-head-placeholder.mp4&quot;},
    {&quot;id&quot;: &quot;videoPosition&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Video odak noktası (CSS object-position)&quot;, &quot;default&quot;: &quot;50% 35%&quot;},
    {&quot;id&quot;: &quot;placeholderNote&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Yer tutucu notu (gerçek videoda boş bırakın)&quot;, &quot;default&quot;: &quot;Video alanı · kendi çekiminiz&quot;},
    {&quot;id&quot;: &quot;speakerName&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Alt bant: isim&quot;, &quot;default&quot;: &quot;Konuşmacı Adı&quot;},
    {&quot;id&quot;: &quot;speakerRole&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Alt bant: unvan&quot;, &quot;default&quot;: &quot;Beta Studio&quot;},
    {&quot;id&quot;: &quot;captions&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Altyazılar (saniye|metin||…)&quot;, &quot;default&quot;: &quot;2.8|En sık duyduğumuz soru:||5.0|“Bize de *uygulama* lazım mı?”||7.6|Biz önce başka bir şey sorarız:||10.0|Müşteriniz *nerede* takılıyor?||12.6|Çoğu zaman cevap:|telefonla randevu.||14.6|Yani çözüm uygulama değil,|bir *randevu linki.*&quot;},
    {&quot;id&quot;: &quot;callout&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Üst vurgu (saniye|ETİKET::metin, 3 sn)&quot;, &quot;default&quot;: &quot;10.0|Beta kuralı::Önce *problem.*&quot;},
    {&quot;id&quot;: &quot;payoffA&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Payoff (sessiz satır)&quot;, &quot;default&quot;: &quot;Uygulama değil,&quot;},
    {&quot;id&quot;: &quot;payoffB&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Payoff (güçlü satır)&quot;, &quot;default&quot;: &quot;*çözüm* yaptırın.&quot;},
    {&quot;id&quot;: &quot;cta&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;CTA&quot;, &quot;default&quot;: &quot;Sizin darboğazınız ne? *Yorumlara* yazın.&quot;}
  ]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Template E — Story / talking head</title>
    <link rel="stylesheet" href="system/fonts.css">
    <link rel="stylesheet" href="system/beta.css">
    <script src="system/gsap.min.js"></script>
    <script src="system/beta.js"></script>
    <script src="system/brand.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0c16;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #te-video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        object-position: var(--videoPosition, 50% 35%);
      }
      .te-scrim {
        position: absolute;
        left: 0;
        right: 0;
        pointer-events: none;
      }
      #te-scrim-top {
        top: 0;
        height: 760px;
        background: linear-gradient(180deg, rgba(10, 12, 22, 0.82), rgba(10, 12, 22, 0.5) 45%, rgba(10, 12, 22, 0));
      }
      #te-scrim-bot {
        bottom: 0;
        height: 900px;
        background: linear-gradient(0deg, rgba(10, 12, 22, 0.88), rgba(10, 12, 22, 0.55) 55%, rgba(10, 12, 22, 0));
      }
      #te-dim {
        position: absolute;
        inset: 0;
        background: #0a0c16;
        opacity: 0;
      }
      .te-ui,
      #te-payoff {
        position: absolute;
        inset: 0;
        color: var(--fg);
      }
      #te-payoff {
        opacity: 0;
      }
      #te-hook {
        position: absolute;
        left: 72px;
        top: 330px;
        width: 920px;
        font-size: 124px;
      }
      /* lower third */
      #te-lt {
        position: absolute;
        left: 72px;
        top: 320px;
        display: flex;
        align-items: stretch;
        gap: 24px;
        opacity: 0;
      }
      #te-lt-bar {
        width: 10px;
        border-radius: 5px;
        background: var(--bs-iris);
      }
      #te-lt-name {
        display: block;
        font-family: var(--bs-font-display);
        font-weight: 800;
        font-size: 56px;
        line-height: 1.05;
        letter-spacing: -0.025em;
      }
      #te-lt-role {
        display: block;
        margin-top: 10px;
        color: var(--fg-muted);
        text-transform: none; /* names/titles keep their own casing (Studio ≠ STUDİO) */
      }
      /* callout */
      #te-callout {
        position: absolute;
        left: 72px;
        top: 320px;
        width: 900px;
        opacity: 0;
      }
      #te-co-label {
        display: block;
        margin-bottom: 16px;
        color: var(--accent-text);
      }
      #te-co-text {
        margin: 0;
        font-size: 96px;
      }
      /* captions */
      .te-cap {
        position: absolute;
        left: 72px;
        top: 1190px;
        width: 858px;
        text-align: center;
        opacity: 0;
      }
      .te-cap__text {
        display: inline;
        padding: 6px 22px 10px;
        border-radius: 22px;
        background: rgba(10, 12, 22, 0.66);
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
        font-family: var(--bs-font-display);
        font-weight: 750;
        font-size: 64px;
        line-height: 1.32;
        letter-spacing: -0.02em;
        color: var(--bs-paper);
      }
      /* multi-line captions ("a|b"): one pill per line */
      .te-cap__text:has(.bs-line) {
        padding: 0;
        background: none;
      }
      .te-cap__text .bs-line {
        width: fit-content; /* shrink-wrap each line, centred by the auto margins */
        margin: 0 auto 10px;
        padding: 6px 22px 10px;
        border-radius: 22px;
        background: rgba(10, 12, 22, 0.66);
      }
      #te-ph {
        position: absolute;
        left: 0;
        right: 0;
        top: 820px;
        width: fit-content;
        margin: 0 auto;
        padding: 14px 26px;
        border-radius: 999px;
        background: rgba(242, 240, 235, 0.12);
        border: 2px dashed rgba(242, 240, 235, 0.4);
        color: var(--bs-paper);
        font-family: var(--bs-font-mono);
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      #te-pa {
        position: absolute;
        left: 72px;
        top: 620px;
        width: 900px;
        font-size: 92px;
        color: var(--fg-muted);
      }
      #te-pb {
        position: absolute;
        left: 72px;
        top: 740px;
        width: 990px;
        font-size: 132px;
      }
      .bs-serif {
        color: var(--accent-text);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <video id="te-video" class="clip" data-start="0" data-duration="20" data-track-index="0" data-var-src="videoSrc" src="system/assets/demo/talking-head-placeholder.mp4" playsinline data-has-audio="true" data-volume="1"></video>

      <div id="te-ui" class="te-ui bs-theme-ink">
        <div id="te-scrim-top" class="te-scrim" data-layout-ignore></div>
        <div id="te-scrim-bot" class="te-scrim" data-layout-ignore></div>
        <div id="te-ph" data-layout-allow-overlap>Video alanı</div>
        <h1 id="te-hook" class="bs-hook">Hook</h1>
        <div id="te-lt">
          <span id="te-lt-bar"></span>
          <div><span id="te-lt-name">Ad</span><span id="te-lt-role" class="bs-label">Rol</span></div>
        </div>
        <div id="te-callout"><span id="te-co-label" class="bs-label">Label</span><h2 id="te-co-text" class="bs-hook">Callout</h2></div>
        <div id="te-caps"></div>
        <div id="te-dim" data-layout-ignore></div>
      </div>
      <div id="te-payoff" class="bs-theme-ink">
        <h2 id="te-pa" class="bs-headline">Payoff A</h2>
        <h2 id="te-pb" class="bs-hook">Payoff B<span id="te-caret" class="bs-caret"></span></h2>
      </div>
      <div id="te-end"></div>

      <div id="chrome" class="bs-chrome bs-theme-ink">
        <div id="tag" class="bs-tag"><span class="bs-tag__dot"></span><span id="tag-text">Seri</span></div>
        <div class="bs-ticks"><span class="bs-tick"><i id="tick1"></i></span><span class="bs-tick"><i id="tick2"></i></span><span class="bs-tick"><i id="tick3"></i></span><span class="bs-tick"><i id="tick4"></i></span></div>
        <div id="handle" class="bs-handle">@betastudio.cy</div>
      </div>

      <audio id="a-music" src="system/music/cuts/template-e-story.mp3" data-start="0" data-duration="20" data-track-index="10" data-volume="0.3"></audio>
      <audio id="sfx-h1" src="system/sfx/impact-bass-2.mp3" data-start="0.1" data-duration="1.4" data-track-index="11" data-volume="0.26"></audio>
      <audio id="sfx-lt" src="system/sfx/whoosh-short.mp3" data-start="2.8" data-duration="0.57" data-track-index="12" data-volume="0.26"></audio>
      <audio id="sfx-pay" src="system/sfx/impact-bass-1.mp3" data-start="16.4" data-duration="1.8" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-end" src="system/sfx/typing.mp3" data-start="18.75" data-duration="0.5" data-track-index="14" data-volume="0.28"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const clock = BS.clock(tl, 20);
      const v = BS.vars();
      const $ = (s) => document.getElementById(s);
      const T = { hook: 0, lt: 2.8, ltEnd: 6.6, pay: 16.4, end: 18.4, total: 20 };
      // "t|text" → { t, text } (only the first "|" splits; the rest may use | as a line break)
      const timed = (s) =>
        BS.list(s)
          .map((x) => {
            const i = x.indexOf("|");
            return { t: parseFloat(x.slice(0, i)), text: x.slice(i + 1).trim() };
          })
          .filter((c) => isFinite(c.t) && c.text)
          .sort((a, b) => a.t - b.t);

      $("tag-text").textContent = v.series || "KKTC İşletme Doktoru";

      // ---- placeholder note (empty it once real footage is in) ----------------------
      if (v.placeholderNote) {
        $("te-ph").textContent = v.placeholderNote;
        tl.to("#te-ph", { opacity: 0, duration: 0.2 }, T.pay);
      } else {
        $("te-ph").style.display = "none";
      }

      // ---- hook (A/B) over the footage ----------------------------------------------
      const hook = $("te-hook");
      BS.rich(hook, BS.pick(v, "hook", "Hook"));
      BS.reveal(tl, hook, 0.1, "rise", { stagger: 0.07, dur: 0.6 });
      BS.marks(hook).forEach((p, i) => BS.draw(tl, p, 1.35 + i * 0.15, 0.4));
      BS.exit(tl, hook, T.lt - 0.3, "lift", { dur: 0.22 });

      // ---- lower third ----------------------------------------------------------------
      $("te-lt-name").textContent = v.speakerName || "";
      $("te-lt-role").textContent = v.speakerRole || "";
      if (v.speakerName) {
        tl.set("#te-lt", { opacity: 1 }, T.lt);
        tl.fromTo("#te-lt-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "expo.out", transformOrigin: "50% 0%" }, T.lt);
        BS.slide(tl, "#te-lt-name", T.lt + 0.1, { dir: "left", dist: 40, dur: 0.45 });
        BS.fade(tl, "#te-lt-role", T.lt + 0.3, { dur: 0.35 });
        BS.exit(tl, "#te-lt", T.ltEnd - 0.25, "left", { dur: 0.25 });
      }

      // ---- callout ----------------------------------------------------------------------
      const co = timed(v.callout)[0];
      if (co) {
        const c = BS.labeled(co.text, "");
        $("te-co-label").textContent = c.label;
        BS.rich($("te-co-text"), c.text);
        tl.set("#te-callout", { opacity: 1 }, co.t);
        tl.fromTo("#te-co-label", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, co.t + 0.05);
        BS.reveal(tl, $("te-co-text"), co.t + 0.1, "slam", { stagger: 0.05, from: 1.3 });
        BS.marks($("te-co-text")).forEach((p, i) => BS.draw(tl, p, co.t + 0.8 + i * 0.15, 0.35));
        BS.exit(tl, "#te-callout", Math.min(co.t + 3, T.pay) - 0.25, "lift", { dur: 0.22 });
      }

      // ---- captions ---------------------------------------------------------------------
      const caps = timed(v.captions).filter((c) => c.t < T.pay);
      caps.forEach((c, i) => {
        const end = i + 1 < caps.length ? caps[i + 1].t : T.pay;
        const box = document.createElement("div");
        box.className = "te-cap";
        const span = document.createElement("span");
        span.className = "te-cap__text";
        box.appendChild(span);
        $("te-caps").appendChild(box);
        BS.rich(span, c.text);
        tl.set(box, { opacity: 1 }, c.t);
        BS.reveal(tl, span, c.t, "pop", { stagger: 0.03, dur: 0.22 });
        tl.set(box, { opacity: 0 }, end - 0.04);
      });

      // ---- payoff over the dimmed footage -------------------------------------------------
      tl.fromTo("#te-dim", { opacity: 0 }, { opacity: 0.86, duration: 0.35, ease: "power2.out" }, T.pay - 0.1);
      BS.rich($("te-pa"), v.payoffA || "");
      const pb = $("te-pb");
      const caret = $("te-caret");
      BS.rich(pb, v.payoffB || "");
      pb.appendChild(caret);
      BS.reveal(tl, $("te-pa"), T.pay + 0.1, "rise", { stagger: 0.05 });
      BS.reveal(tl, pb, T.pay + 0.45, "tilt", { stagger: 0.08 });
      BS.blink(clock, caret, T.pay + 1.0, T.end, { before: 0 });
      tl.set("#te-payoff", { opacity: 1 }, T.pay);
      tl.set("#te-payoff", { opacity: 0 }, T.end);

      // ---- end card + chrome ----------------------------------------------------------------
      BS.endcardInto(tl, clock, $("te-end"), T.end, { cta: v.cta });
      BS.chrome(tl, {
        tag: "#tag",
        handle: "#handle",
        ticks: ["tick1", "tick2", "tick3", "tick4"].map($),
        chapters: [
          [T.hook, T.lt],
          [T.lt, 9],
          [9, T.pay],
          [T.pay, T.end],
        ],
      });
      tl.to("#chrome", { opacity: 0, duration: 0.2 }, T.end - 0.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
