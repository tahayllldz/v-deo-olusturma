  re-typed at the end of the first "problem" step that targets it.

    hook 0–2.6 · step 1 2.6–5.8 · step 2 5.8–9.0 · step 3 9.0–12.2 · result 12.2–14.6

      $("tb-url").textContent = v.siteUrl || "isletmeniz.com";
      $("sb-name").textContent = v.siteName || "İşletme";
      $("sb-head-old").textContent = v.siteHeadline || "";
      $("sb-sub").textContent = v.siteSub || "";
      $("sb-cta").textContent = v.siteCta || "";
      BS.list(v.siteCards).slice(0, 3).forEach((c) => {
        const d = document.createElement("div");
        d.className = "sb-card";
        d.innerHTML = "<i></i>";
        d.appendChild(document.createTextNode(c));
        $("sb-cards").appendChild(d);
      });

      // ---- hook (A/B) -----------------------------------------------------
      const hook = $("tb-hook");
      BS.rich(hook, BS.pick(v, "hook", "Hook"));
      BS.reveal(tl, hook, 0.1, "rise", { stagger: 0.07, dur: 0.6 });
      BS.marks(hook).forEach((p, i) => BS.draw(tl, p, 1.35 + i * 0.15, 0.4));
      BS.exit(tl, hook, T.s1 - 0.2, "lift", { dur: 0.22 });

      // browser peeks under the hook, then slides into the frame
      tl.fromTo("#tb-browser", { y: 1000 }, { y: 520, duration: 0.7, ease: "power3.out" }, 1.0);
      tl.fromTo("#tb-browser", { y: 520 }, { y: 0, duration: 0.7, ease: "power3.inOut", immediateRender: false }, T.s1 - 0.1);

      // ---- cursor -----------------------------------------------------------
      const cursor = $("tb-cursor");
      cursor.insertAdjacentHTML("beforeend", BS.cursorSVG);
      const aim = (k) => ({ x: VIEW.x + BOX[k].x + BOX[k].w * 0.62, y: VIEW.y + BOX[k].y + BOX[k].h * 0.58 });
      const path = [{ t: 0, x: 1000, y: 1700 }];
      tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.25 }, T.s1 + 0.4);

      // ---- steps ------------------------------------------------------------
      let headlineFixed = false;
      [1, 2, 3].forEach((n) => {
        const at = T["s" + n];
        const step = BS.labeled(v["step" + n], "");
        const target = BOX[v["step" + n + "Target"]] ? v["step" + n + "Target"] : "cta";
        const fix = v["step" + n + "Mark"] !== "problem";
        const lab = $("tb-c" + n + "-l");
        lab.textContent = step.label;
        if (!fix) lab.classList.add("is-pen");
        BS.rich($("tb-c" + n + "-t"), step.text);

        tl.set("#tb-c" + n, { opacity: 1 }, at);
        tl.fromTo(lab, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at + 0.05);
        BS.reveal(tl, $("tb-c" + n + "-t"), at + 0.1, "rise", { stagger: 0.05, dur: 0.55 });
        BS.marks($("tb-c" + n + "-t")).forEach((p, i) => BS.draw(tl, p, at + 0.9 + i * 0.15, 0.35));
        BS.exit(tl, "#tb-c" + n, at + STEP - 0.22, "lift", { dur: 0.2 });

        const a = aim(target);
        path.push({ t: at + 0.2, x: a.x, y: a.y, dur: 0.6 });
        const b = BOX[target];
        const mark = BS.pen($("tb-marks"), fix ? "box" : "circle", b, { fix: fix, seed: 11 + n * 7 });
        if (fix) {
          BS.click(tl, cursor, at + 0.85, { target: "#" + TARGET_EL[target] });
          BS.draw(tl, mark, at + 0.95, 0.45, "power2.inOut");
        } else {
          BS.draw(tl, mark, at + 0.7, 0.55);
        }
        let markOut = at + STEP - 0.25;

        // first "problem" on the headline can re-type it with the fix
        if (!fix && target === "headline" && v.siteHeadlineFix && !headlineFixed) {
          headlineFixed = true;
          const fixAt = at + 2.0;
          markOut = fixAt - 0.2;
          tl.to("#sb-head-old", { opacity: 0, y: -16, duration: 0.2, ease: "power2.in" }, fixAt);
          tl.set("#sb-head-old", { display: "none" }, fixAt + 0.2);
          BS.type(clock, $("sb-head-new"), v.siteHeadlineFix, fixAt + 0.22, 40);
        }
        tl.to(mark.parentNode, { opacity: 0, duration: 0.2 }, markOut);
      });
      path.push({ t: T.res - 0.1, x: 980, y: 1560, dur: 0.5, ease: "power2.in" });
      BS.cursorPath(tl, cursor, path);
      tl.to(cursor, { opacity: 0, duration: 0.2 }, T.res + 0.25);

      // ---- result: a notification lands ------------------------------------
      $("tb-notif-app").textContent = v.resultApp || "Bildirim";
      $("tb-notif-title").textContent = v.resultTitle || "";
      $("tb-notif-body").textContent = v.resultBody || "";
      tl.set("#tb-notif", { opacity: 1 }, T.res + 0.2);
      BS.drop(tl, "#tb-notif", T.res + 0.22, { from: -180, dur: 0.55 });
      tl.to("#tb-browser", { scale: 0.94, y: 30, duration: 0.6, ease: "power2.inOut" }, T.res + 0.1);

      // ---- payoff -------------------------------------------------------------
      tl.set("#tb-pay", { opacity: 1 }, T.pay);
      tl.set("#tb-stage", { opacity: 0 }, T.pay);
      BS.rich($("tb-pa"), v.payoffA || "");
      const pb = $("tb-pb");
      const caret = $("tb-caret");
      BS.rich(pb, v.payoffB || "");
      pb.appendChild(caret);
      BS.reveal(tl, $("tb-pa"), T.pay + 0.06, "rise", { stagger: 0.05 });
      BS.reveal(tl, pb, T.pay + 0.4, "tilt", { stagger: 0.08 });
      BS.blink(clock, caret, T.pay + 0.95, T.end, { before: 0 });
      tl.set("#tb-pay", { opacity: 0 }, T.end);

      // ---- end card + chrome --------------------------------------------------
      BS.endcardInto(tl, clock, $("tb-end"), T.end, { cta: v.cta });
      BS.chrome(tl, {
        tag: "#tag",
        handle: "#handle",
        ticks: ["tick1", "tick2", "tick3", "tick4"].map($),
        chapters: [
          [T.hook, T.s1],
          [T.s1, T.s2],
          [T.s2, T.res],
          [T.res, T.end],
        ],
      });
      BS.theme(tl, "#chrome", T.pay, "ink", "bs-chrome");
      tl.to("#chrome", { opacity: 0, duration: 0.2 }, T.end - 0.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
