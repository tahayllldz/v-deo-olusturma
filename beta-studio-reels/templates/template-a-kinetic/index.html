<!DOCTYPE html>
<!--
  TEMPLATE A — Kinetic typography (statement relay)          15.0 s · 1080×1920
  Use for: hot takes, business psychology, "Dijital Gerçekler", quotes.
  Reference reel: compositions/reel-05-hot-take

  A new video = a new content file. Nothing in this HTML needs editing:
    npx hyperframes render --variables-file content/example.json --output out.mp4
  (or from beta-studio-reels/:  npm run template -- a content/my-video.json)

  Timeline (change data-duration + the T constants below together):
    hook 0.0–2.6 · beat 1 2.6–5.2 · beat 2 5.2–7.8 · beat 3 7.8–10.4 · payoff 10.4–13.2 · end 13.2–15.0
  Text markup in every string:  *serif voice*  _accent_  ~red-pen underline~  ^red text^  | line break
  Beats use "LABEL::Headline".
-->
<html lang="tr" data-resolution="portrait" data-composition-variables="[
    {&quot;id&quot;:&quot;theme&quot;,&quot;type&quot;:&quot;enum&quot;,&quot;label&quot;:&quot;Tema&quot;,&quot;default&quot;:&quot;ink&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;ink&quot;,&quot;label&quot;:&quot;Mürekkep (logo zemini)&quot;},{&quot;value&quot;:&quot;paper&quot;,&quot;label&quot;:&quot;Kâğıt&quot;},{&quot;value&quot;:&quot;signal&quot;,&quot;label&quot;:&quot;Sinyal (kobalt)&quot;}]},
    {&quot;id&quot;:&quot;flipMiddle&quot;,&quot;type&quot;:&quot;boolean&quot;,&quot;label&quot;:&quot;2. vuruşta tema çevir&quot;,&quot;default&quot;:true},
    {&quot;id&quot;:&quot;series&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Seri etiketi&quot;,&quot;default&quot;:&quot;Dijital Gerçekler · 06&quot;},
    {&quot;id&quot;:&quot;hookVariant&quot;,&quot;type&quot;:&quot;enum&quot;,&quot;label&quot;:&quot;Hook varyantı&quot;,&quot;default&quot;:&quot;A&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;A&quot;,&quot;label&quot;:&quot;A — Problem-first&quot;},{&quot;value&quot;:&quot;B&quot;,&quot;label&quot;:&quot;B — Controversial&quot;}]},
    {&quot;id&quot;:&quot;hookA&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Hook A&quot;,&quot;default&quot;:&quot;Takipçi satın|almak sizi|~büyütmez.~&quot;},
    {&quot;id&quot;:&quot;hookB&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Hook B&quot;,&quot;default&quot;:&quot;5.000 takipçi|aldınız.|*Tebrikler.*&quot;},
    {&quot;id&quot;:&quot;beat1&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Vuruş 1 (ETİKET::metin)&quot;,&quot;default&quot;:&quot;Gerçek şu::Satın alınan takipçi|alışveriş *yapmaz.*&quot;},
    {&quot;id&quot;:&quot;beat2&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Vuruş 2&quot;,&quot;default&quot;:&quot;Üstelik::Etkileşim düşer,|erişim ~daralır.~&quot;},
    {&quot;id&quot;:&quot;beat3&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Vuruş 3&quot;,&quot;default&quot;:&quot;Bunun yerine::Küçük ama *gerçek*|bir kitle kurun.&quot;},
    {&quot;id&quot;:&quot;payoffA&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Payoff (sessiz satır)&quot;,&quot;default&quot;:&quot;Sayı değil,&quot;},
    {&quot;id&quot;:&quot;payoffB&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Payoff (güçlü satır)&quot;,&quot;default&quot;:&quot;*güven* büyütün.&quot;},
    {&quot;id&quot;:&quot;cta&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;CTA&quot;,&quot;default&quot;:&quot;Takipte kalın, *gerçek büyümeyi* anlatıyoruz.&quot;}
  ]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Template A — Kinetic typography</title>
    <link rel="stylesheet" href="system/fonts.css">
    <link rel="stylesheet" href="system/beta.css">
    <script src="system/gsap.min.js"></script>
    <script src="system/beta.js"></script>
    <script src="system/brand.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0c16;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .ta-layer {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .ta-glow {
        position: absolute;
        left: -120px;
        top: 560px;
        width: 1200px;
        height: 1000px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(139, 92, 246, 0.26), rgba(76, 107, 255, 0.1) 55%, rgba(10, 12, 22, 0) 100%);
      }
      #ta-hook {
        position: absolute;
        left: 72px;
        top: 330px;
        width: 940px;
        font-size: 138px;
      }
      .ta-label {
        position: absolute;
        left: 72px;
        top: 600px;
        color: var(--accent-text);
      }
      .ta-text {
        position: absolute;
        left: 72px;
        top: 660px;
        width: 940px;
        font-size: 124px;
      }
      .ta-ghost {
        left: -40px;
        top: 1180px;
      }
      #ta-pa {
        position: absolute;
        left: 72px;
        top: 620px;
        width: 900px;
        font-size: 92px;
        color: var(--fg-muted);
      }
      #ta-pb {
        position: absolute;
        left: 72px;
        top: 740px;
        width: 990px;
        font-size: 132px;
      }
      .bs-serif {
        color: var(--accent-text);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="ta-bg" class="bs-scene bs-theme-ink"><div class="bs-dots"></div></div>
      <div id="ta-l0" class="ta-layer bs-scene bs-theme-ink"><div class="bs-dots"></div><h1 id="ta-hook" class="bs-hook">Hook</h1></div>
      <div id="ta-l1" class="ta-layer bs-scene bs-theme-ink"><div class="bs-dots"></div><div class="ta-glow" data-layout-ignore=""></div><div id="ta-g1" class="bs-ghost ta-ghost" data-layout-ignore="">01</div><div id="ta-lab1" class="bs-label ta-label">Label</div><h2 id="ta-t1" class="bs-hook ta-text">Beat 1</h2></div>
      <div id="ta-l2" class="ta-layer bs-scene bs-theme-ink"><div class="bs-dots"></div><div id="ta-g2" class="bs-ghost ta-ghost" data-layout-ignore="">02</div><div id="ta-lab2" class="bs-label ta-label">Label</div><h2 id="ta-t2" class="bs-hook ta-text">Beat 2</h2></div>
      <div id="ta-l3" class="ta-layer bs-scene bs-theme-ink"><div class="bs-dots"></div><div class="ta-glow" data-layout-ignore=""></div><div id="ta-g3" class="bs-ghost ta-ghost" data-layout-ignore="">03</div><div id="ta-lab3" class="bs-label ta-label">Label</div><h2 id="ta-t3" class="bs-hook ta-text">Beat 3</h2></div>
      <div id="ta-l4" class="ta-layer bs-scene bs-theme-ink"><div class="bs-dots"></div><div class="ta-glow" data-layout-ignore=""></div><h2 id="ta-pa" class="bs-headline">Payoff A</h2><h2 id="ta-pb" class="bs-hook">Payoff B<span id="ta-caret" class="bs-caret"></span></h2></div>
      <div id="ta-end"></div>

      <div id="chrome" class="bs-chrome bs-theme-ink">
        <div id="tag" class="bs-tag"><span class="bs-tag__dot"></span><span id="tag-text">Seri</span></div>
        <div class="bs-ticks"><span class="bs-tick"><i id="tick1"></i></span><span class="bs-tick"><i id="tick2"></i></span><span class="bs-tick"><i id="tick3"></i></span><span class="bs-tick"><i id="tick4"></i></span></div>
        <div id="handle" class="bs-handle">@betastudio.cy</div>
      </div>

      <audio id="a-music" src="system/music/cuts/template-a-kinetic.mp3" data-start="0" data-duration="15" data-track-index="10" data-volume="0.95"></audio>
      <audio id="sfx-h1" src="system/sfx/impact-bass-1.mp3" data-start="0.1" data-duration="1.4" data-track-index="11" data-volume="0.38"></audio>
      <audio id="sfx-h2" src="system/sfx/key-press.mp3" data-start="0.7" data-duration="0.4" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-h3" src="system/sfx/impact-bass-2.mp3" data-start="1.3" data-duration="1.4" data-track-index="13" data-volume="0.36"></audio>
      <audio id="sfx-b1" src="system/sfx/whoosh.mp3" data-start="2.58" data-duration="0.57" data-track-index="14" data-volume="0.38"></audio>
      <audio id="sfx-b2" src="system/sfx/whoosh.mp3" data-start="5.18" data-duration="0.57" data-track-index="15" data-volume="0.38"></audio>
      <audio id="sfx-b3" src="system/sfx/whoosh.mp3" data-start="7.78" data-duration="0.57" data-track-index="16" data-volume="0.38"></audio>
      <audio id="sfx-pay" src="system/sfx/impact-bass-1.mp3" data-start="10.4" data-duration="1.8" data-track-index="11" data-volume="0.36"></audio>
      <audio id="sfx-type" src="system/sfx/typing.mp3" data-start="13.55" data-duration="0.5" data-track-index="12" data-volume="0.3"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const clock = BS.clock(tl, 15);
      const v = BS.vars();
      const $ = (s) => document.getElementById(s);
      const T = { hook: 0, b1: 2.6, b2: 5.2, b3: 7.8, pay: 10.4, end: 13.2, total: 15 };

      // ---- themes -------------------------------------------------------
      const base = ["ink", "paper", "signal"].indexOf(v.theme) >= 0 ? v.theme : "ink";
      const flip = v.flipMiddle !== false ? (base === "paper" ? "ink" : "paper") : base;
      const themeOf = { l0: base, l1: base, l2: flip, l3: base, l4: base === "paper" ? "ink" : base };
      Object.keys(themeOf).forEach((k) => ($("ta-" + k).className = "ta-layer bs-scene bs-theme-" + themeOf[k]));
      $("ta-bg").className = "bs-scene bs-theme-" + base;
      $("chrome").className = "bs-chrome bs-theme-" + base;
      $("tag-text").textContent = v.series || "Dijital Gerçekler";

      // ---- layer windows (hard cuts on the timeline) ----------------------
      const show = (id, a, b) => {
        tl.set("#" + id, { opacity: 1 }, a);
        if (b != null) tl.set("#" + id, { opacity: 0 }, b);
      };
      show("ta-l0", T.hook, T.b1);
      show("ta-l1", T.b1, T.b2);
      show("ta-l2", T.b2, T.b3);
      show("ta-l3", T.b3, T.pay);
      show("ta-l4", T.pay, T.end);

      // ---- hook (A/B) -----------------------------------------------------
      const hook = $("ta-hook");
      BS.rich(hook, BS.pick(v, "hook", "Hook"));
      const hp = BS.split(hook);
      const lines = BS.$$(".bs-line", hook);
      (lines.length ? lines : [hook]).forEach((line, i) => {
        tl.fromTo(BS.$$(".w", line), { scale: 1.55, opacity: 0, transformOrigin: "0% 80%" }, { scale: 1, opacity: 1, duration: 0.32, ease: "power4.out", stagger: 0.04 }, 0.1 + i * 0.6);
      });
      BS.marks(hook).forEach((p, i) => BS.draw(tl, p, 1.55 + i * 0.15, 0.35));
      tl.to(hp.words, { yPercent: -40, opacity: 0, duration: 0.2, ease: "power2.in", stagger: 0.015 }, T.b1 - 0.22);

      // ---- three beats, three different entrances -------------------------
      const styles = ["rise", "slam", "tilt"];
      [1, 2, 3].forEach((n) => {
        const b = BS.labeled(v["beat" + n], "");
        const at = T["b" + n];
        $("ta-lab" + n).textContent = b.label;
        BS.rich($("ta-t" + n), b.text);
        tl.fromTo("#ta-lab" + n, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at + 0.05);
        BS.reveal(tl, $("ta-t" + n), at + 0.1, styles[n - 1], { stagger: 0.06, from: 1.4 });
        BS.marks($("ta-t" + n)).forEach((p, i) => BS.draw(tl, p, at + 1.0 + i * 0.15, 0.35));
        tl.fromTo("#ta-g" + n, { x: 0 }, { x: -160, duration: 2.6, ease: "none" }, at);
      });

      // ---- payoff ---------------------------------------------------------
      BS.rich($("ta-pa"), v.payoffA || "");
      const pb = $("ta-pb");
      const caret = $("ta-caret");
      BS.rich(pb, v.payoffB || "");
      pb.appendChild(caret);
      BS.reveal(tl, $("ta-pa"), T.pay + 0.06, "rise", { stagger: 0.05 });
      BS.reveal(tl, pb, T.pay + 0.45, "tilt", { stagger: 0.08 });
      BS.blink(clock, caret, T.pay + 1.0, T.end, { before: 0 });

      // ---- end card + chrome ----------------------------------------------
      BS.endcardInto(tl, clock, $("ta-end"), T.end, { cta: v.cta });
      BS.chrome(tl, {
        tag: "#tag",
        handle: "#handle",
        ticks: ["tick1", "tick2", "tick3", "tick4"].map($),
        chapters: [
          [T.hook, T.b1],
          [T.b1, T.b3],
          [T.b3, T.pay],
          [T.pay, T.end],
        ],
      });
      BS.theme(tl, "#chrome", T.b2, themeOf.l2, "bs-chrome");
      BS.theme(tl, "#chrome", T.b3, themeOf.l3, "bs-chrome");
      BS.theme(tl, "#chrome", T.pay, themeOf.l4, "bs-chrome");
      tl.to("#chrome", { opacity: 0, duration: 0.2 }, T.end - 0.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
