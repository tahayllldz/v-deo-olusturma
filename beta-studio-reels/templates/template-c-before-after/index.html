<!DOCTYPE html>
<!--
  TEMPLATE C — Before / After (wipe + compare slider)          16.0 s · 1080×1920
  Use for: "Önce/Sonra", redesign reveals, profile / menu / logo makeovers.
  Reference reel: compositions/reel-04-redesign

  A new video = two images + a content file. Nothing in this HTML needs editing:
    1. put the images in beta-studio-reels/assets/ (e.g. assets/my-before.png)
    2. npm run sync   (copies assets/ into every project as system/assets/)
    3. content JSON: "beforeSrc": "system/assets/my-before.png", "afterSrc": "system/assets/my-after.png"
    npx hyperframes render --variables-file content/example.json --output out.mp4
  (or from beta-studio-reels/:  npm run template -- c content/my-video.json)

  Only use client screenshots with the client's permission. The demo images
  (system/assets/demo/before.png, after.png) are a fictional brand.

  Timeline (change data-duration + the T constants below together):
    hook 0–2.4 · before 2.4–5.6 · wipe 5.6–6.6 · after 6.6–10.4 · compare 10.4–12.4
    payoff 12.4–14.4 · end card 14.4–16.0
  Text markup in every string:  *serif voice*  _accent_  ~red-pen underline~  ^red text^  | line break
  Lists use "a||b||c" (max 3).
-->
<html lang="tr" data-resolution="portrait" data-composition-variables="[
    {&quot;id&quot;: &quot;series&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Seri etiketi&quot;, &quot;default&quot;: &quot;Önce/Sonra · 03&quot;},
    {&quot;id&quot;: &quot;hookVariant&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;label&quot;: &quot;Hook varyantı&quot;, &quot;default&quot;: &quot;A&quot;, &quot;options&quot;: [{&quot;value&quot;: &quot;A&quot;, &quot;label&quot;: &quot;A — problem önce&quot;}, {&quot;value&quot;: &quot;B&quot;, &quot;label&quot;: &quot;B — tartışmalı&quot;}]},
    {&quot;id&quot;: &quot;hookA&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Hook A&quot;, &quot;default&quot;: &quot;Bu siteden|sipariş|~verir miydiniz?~&quot;},
    {&quot;id&quot;: &quot;hookB&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Hook B&quot;, &quot;default&quot;: &quot;Siteniz hâlâ|*2009* gibi mi?&quot;},
    {&quot;id&quot;: &quot;beforeSrc&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Önce görseli (system/assets/…)&quot;, &quot;default&quot;: &quot;system/assets/demo/before.png&quot;},
    {&quot;id&quot;: &quot;afterSrc&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Sonra görseli (system/assets/…)&quot;, &quot;default&quot;: &quot;system/assets/demo/after.png&quot;},
    {&quot;id&quot;: &quot;frame&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;label&quot;: &quot;Çerçeve&quot;, &quot;default&quot;: &quot;browser&quot;, &quot;options&quot;: [{&quot;value&quot;: &quot;browser&quot;, &quot;label&quot;: &quot;Tarayıcı&quot;}, {&quot;value&quot;: &quot;plain&quot;, &quot;label&quot;: &quot;Sade kart&quot;}]},
    {&quot;id&quot;: &quot;frameUrl&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Tarayıcı adresi&quot;, &quot;default&quot;: &quot;isletmeniz.com&quot;},
    {&quot;id&quot;: &quot;imageFit&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;label&quot;: &quot;Görsel yerleşimi&quot;, &quot;default&quot;: &quot;cover&quot;, &quot;options&quot;: [{&quot;value&quot;: &quot;cover&quot;, &quot;label&quot;: &quot;Doldur + kaydır&quot;}, {&quot;value&quot;: &quot;contain&quot;, &quot;label&quot;: &quot;Sığdır&quot;}]},
    {&quot;id&quot;: &quot;beforeLabel&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Önce etiketi&quot;, &quot;default&quot;: &quot;Önce&quot;},
    {&quot;id&quot;: &quot;afterLabel&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Sonra etiketi&quot;, &quot;default&quot;: &quot;Sonra&quot;},
    {&quot;id&quot;: &quot;beforeLine&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Önce cümlesi&quot;, &quot;default&quot;: &quot;Bilgi çok,|*yön* yok.&quot;},
    {&quot;id&quot;: &quot;problems&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Sorunlar (a||b||c)&quot;, &quot;default&quot;: &quot;Sekiz menü, tek yön yok||“Fiyat için arayınız”||Sipariş linki en altta&quot;},
    {&quot;id&quot;: &quot;afterLine&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Sonra cümlesi&quot;, &quot;default&quot;: &quot;Tek mesaj,|tek *buton.*&quot;},
    {&quot;id&quot;: &quot;fixes&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Çözümler (a||b||c)&quot;, &quot;default&quot;: &quot;Ne sattığı tek cümlede||Tek buton: Sipariş ver||Güven: ödeme + teslimat&quot;},
    {&quot;id&quot;: &quot;note&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Karşılaştırma etiketi / dürüstlük notu&quot;, &quot;default&quot;: &quot;Temsili örnek · kurgusal marka&quot;},
    {&quot;id&quot;: &quot;compareLine&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Karşılaştırma cümlesi&quot;, &quot;default&quot;: &quot;Aynı ürün,|*iki farklı* ilk izlenim.&quot;},
    {&quot;id&quot;: &quot;payoffA&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Payoff (sessiz satır)&quot;, &quot;default&quot;: &quot;Ürün aynı kaldı,&quot;},
    {&quot;id&quot;: &quot;payoffB&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Payoff (güçlü satır)&quot;, &quot;default&quot;: &quot;*vitrin* değişti.&quot;},
    {&quot;id&quot;: &quot;cta&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;CTA&quot;, &quot;default&quot;: &quot;Sitenizin önce/sonrası için *kaydedin.*&quot;}
  ]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Template C — Before / After</title>
    <link rel="stylesheet" href="system/fonts.css">
    <link rel="stylesheet" href="system/beta.css">
    <script src="system/gsap.min.js"></script>
    <script src="system/beta.js"></script>
    <script src="system/brand.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f2f0eb;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .tc-layer {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      #tc-hook {
        position: absolute;
        left: 72px;
        top: 300px;
        width: 920px;
        font-size: 116px;
      }
      .tc-cap {
        position: absolute;
        left: 72px;
        top: 296px;
        width: 900px;
        opacity: 0;
      }
      .tc-cap .bs-label {
        display: block;
        margin-bottom: 18px;
        color: var(--accent-text);
      }
      .tc-cap .bs-label.is-pen {
        color: var(--pen);
      }
      .tc-cap .bs-label.is-muted {
        color: var(--fg-muted);
      }
      .tc-cap h2 {
        margin: 0;
        font-size: 84px;
      }
      /* ---------- frame ---------- */
      #tc-frame {
        position: absolute;
        left: 90px;
        top: 560px;
      }
      #tc-frame.is-plain .bs-browser__bar {
        display: none;
      }
      #tc-frame .bs-browser__view {
        height: 860px;
      }
      .tc-img {
        position: absolute;
        left: 0;
        top: 0;
        width: 900px;
        height: 1000px;
        object-fit: cover;
        object-position: 50% 0%;
      }
      .tc-img.is-contain {
        height: 860px;
        object-fit: contain;
        object-position: 50% 50%;
        background: var(--bs-paper-2);
      }
      #tc-after {
        clip-path: inset(0% 0% 0% 100%);
      }
      .bs-ba__divider {
        opacity: 0;
      }
      .bs-ba__tag {
        opacity: 0;
      }
      #tc-tag-b {
        left: 24px;
        background: var(--bs-redpen);
        color: var(--bs-paper);
      }
      #tc-tag-a {
        right: 24px;
        background: var(--bs-signal);
        color: var(--bs-paper);
      }
      /* ---------- annotation chips ---------- */
      .tc-chips {
        position: absolute;
        left: 120px;
        top: 1170px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
      }
      .tc-chip {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 16px 28px 16px 18px;
        border-radius: 22px;
        background: var(--bs-sheet);
        color: var(--bs-ink);
        font-family: var(--bs-font-display);
        font-weight: 650;
        font-size: 36px;
        letter-spacing: -0.01em;
        white-space: nowrap;
        box-shadow: 0 24px 40px -22px rgba(10, 12, 22, 0.55), 0 0 0 2px rgba(10, 12, 22, 0.06);
      }
      .tc-chip b {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        font-family: var(--bs-font-mono);
        font-size: 28px;
        color: var(--bs-paper);
        background: var(--bs-redpen);
      }
      .tc-chips--fix .tc-chip b {
        background: var(--bs-signal);
      }
      #tc-pa {
        position: absolute;
        left: 72px;
        top: 620px;
        width: 900px;
        font-size: 92px;
        color: var(--fg-muted);
      }
      #tc-pb {
        position: absolute;
        left: 72px;
        top: 740px;
        width: 990px;
        font-size: 132px;
      }
      .tc-glow {
        position: absolute;
        left: -120px;
        top: 560px;
        width: 1200px;
        height: 1000px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(139, 92, 246, 0.26), rgba(76, 107, 255, 0.1) 55%, rgba(10, 12, 22, 0) 100%);
      }
      .bs-serif {
        color: var(--accent-text);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <div id="tc-bg" class="bs-scene bs-theme-paper"><div class="bs-dots"></div></div>

      <div id="tc-stage" class="tc-layer bs-theme-paper" style="opacity: 1">
        <h1 id="tc-hook" class="bs-hook">Hook</h1>
        <div id="tc-c1" class="tc-cap"><span id="tc-c1-l" class="bs-label is-pen">Önce</span><h2 id="tc-c1-t" class="bs-headline">Before</h2></div>
        <div id="tc-c2" class="tc-cap"><span id="tc-c2-l" class="bs-label">Sonra</span><h2 id="tc-c2-t" class="bs-headline">After</h2></div>
        <div id="tc-c3" class="tc-cap"><span id="tc-c3-l" class="bs-label is-muted">Not</span><h2 id="tc-c3-t" class="bs-headline">Compare</h2></div>

        <div id="tc-frame" class="bs-browser">
          <div class="bs-browser__bar">
            <div class="bs-browser__dots"><i></i><i></i><i></i></div>
            <div id="tc-url" class="bs-browser__url" lang="en">isletmeniz.com</div>
            <div class="bs-browser__close">×</div>
          </div>
          <div class="bs-browser__view bs-ba">
            <div class="bs-ba__layer" data-layout-allow-overlap><img id="tc-img-b" class="tc-img" data-var-src="beforeSrc" src="system/assets/demo/before.png" alt="Önce"></div>
            <div id="tc-after" class="bs-ba__layer" data-layout-allow-overlap><img id="tc-img-a" class="tc-img" data-var-src="afterSrc" src="system/assets/demo/after.png" alt="Sonra"></div>
            <div id="tc-div" class="bs-ba__divider" data-layout-allow-overlap><div class="bs-ba__knob" data-layout-allow-overflow>↔</div></div>
            <div id="tc-tag-b" class="bs-ba__tag" data-layout-allow-overlap>Önce</div>
            <div id="tc-tag-a" class="bs-ba__tag" data-layout-allow-overlap>Sonra</div>
          </div>
        </div>
        <div id="tc-probs" class="tc-chips" data-layout-allow-overlap></div>
        <div id="tc-fixes" class="tc-chips tc-chips--fix" data-layout-allow-overlap></div>
      </div>

      <div id="tc-pay" class="tc-layer bs-scene bs-theme-ink">
        <div class="bs-dots"></div>
        <div class="tc-glow" data-layout-ignore></div>
        <h2 id="tc-pa" class="bs-headline">Payoff A</h2>
        <h2 id="tc-pb" class="bs-hook">Payoff B<span id="tc-caret" class="bs-caret"></span></h2>
      </div>
      <div id="tc-end"></div>

      <div id="chrome" class="bs-chrome bs-theme-paper">
        <div id="tag" class="bs-tag"><span class="bs-tag__dot"></span><span id="tag-text">Seri</span></div>
        <div class="bs-ticks"><span class="bs-tick"><i id="tick1"></i></span><span class="bs-tick"><i id="tick2"></i></span><span class="bs-tick"><i id="tick3"></i></span><span class="bs-tick"><i id="tick4"></i></span></div>
        <div id="handle" class="bs-handle">@betastudio.cy</div>
      </div>

      <audio id="a-music" src="system/music/cuts/template-c-before-after.mp3" data-start="0" data-duration="16" data-track-index="10" data-volume="0.9"></audio>
      <audio id="sfx-h1" src="system/sfx/impact-bass-2.mp3" data-start="0.1" data-duration="1.4" data-track-index="11" data-volume="0.32"></audio>
      <audio id="sfx-pen0" src="system/sfx/whoosh-short.mp3" data-start="1.45" data-duration="0.57" data-track-index="12" data-volume="0.26"></audio>
      <audio id="sfx-up" src="system/sfx/whoosh.mp3" data-start="2.3" data-duration="0.57" data-track-index="13" data-volume="0.38"></audio>
      <audio id="sfx-p1" src="system/sfx/pop.mp3" data-start="3.3" data-duration="0.72" data-track-index="14" data-volume="0.36"></audio>
      <audio id="sfx-p2" src="system/sfx/pop.mp3" data-start="3.8" data-duration="0.72" data-track-index="15" data-volume="0.36"></audio>
      <audio id="sfx-p3" src="system/sfx/pop.mp3" data-start="4.3" data-duration="0.72" data-track-index="16" data-volume="0.36"></audio>
      <audio id="sfx-wipe" src="system/sfx/whoosh-cinematic.mp3" data-start="5.55" data-duration="1.4" data-track-index="11" data-volume="0.34"></audio>
      <audio id="sfx-sparkle" src="system/sfx/sparkle.mp3" data-start="6.45" data-duration="1.4" data-track-index="12" data-volume="0.26"></audio>
      <audio id="sfx-f1" src="system/sfx/click-soft.mp3" data-start="7.5" data-duration="0.37" data-track-index="13" data-volume="0.45"></audio>
      <audio id="sfx-f2" src="system/sfx/click-soft.mp3" data-start="8.0" data-duration="0.37" data-track-index="14" data-volume="0.45"></audio>
      <audio id="sfx-f3" src="system/sfx/click-soft.mp3" data-start="8.5" data-duration="0.37" data-track-index="15" data-volume="0.45"></audio>
      <audio id="sfx-cmp" src="system/sfx/whoosh-short.mp3" data-start="10.5" data-duration="0.57" data-track-index="16" data-volume="0.34"></audio>
      <audio id="sfx-pay" src="system/sfx/impact-bass-1.mp3" data-start="12.4" data-duration="1.8" data-track-index="11" data-volume="0.34"></audio>
      <audio id="sfx-end" src="system/sfx/typing.mp3" data-start="14.75" data-duration="0.5" data-track-index="12" data-volume="0.3"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const clock = BS.clock(tl, 16);
      const v = BS.vars();
      const $ = (s) => document.getElementById(s);
      const T = { hook: 0, before: 2.4, wipe: 5.6, after: 6.6, compare: 10.4, pay: 12.4, end: 14.4, total: 16 };
      const W = 900; // frame width (divider travel)

      $("tag-text").textContent = v.series || "Önce/Sonra";
      $("tc-url").textContent = v.frameUrl || "isletmeniz.com";
      if (v.frame === "plain") $("tc-frame").classList.add("is-plain");
      if (v.imageFit === "contain") BS.$$(".tc-img").forEach((im) => im.classList.add("is-contain"));
      $("tc-tag-b").textContent = v.beforeLabel || "Önce";
      $("tc-tag-a").textContent = v.afterLabel || "Sonra";

      // ---- hook: the "before" is already on screen -------------------------
      const hook = $("tc-hook");
      BS.rich(hook, BS.pick(v, "hook", "Hook"));
      BS.reveal(tl, hook, 0.1, "rise", { stagger: 0.07, dur: 0.6 });
      BS.marks(hook).forEach((p, i) => BS.draw(tl, p, 1.4 + i * 0.15, 0.4));
      BS.exit(tl, hook, T.before - 0.2, "lift", { dur: 0.22 });
      tl.fromTo("#tc-frame", { y: 1100 }, { y: 220, duration: 0.8, ease: "expo.out" }, 0.25);
      tl.fromTo("#tc-frame", { y: 220 }, { y: 0, duration: 0.6, ease: "power3.inOut", immediateRender: false }, T.before - 0.15);
      BS.pop(tl, "#tc-tag-b", 0.9, { from: 0.6, dur: 0.35 });

      // ---- captions ------------------------------------------------------------
      const cap = (n, label, text, at, out) => {
        if (label != null) $("tc-c" + n + "-l").textContent = label;
        BS.rich($("tc-c" + n + "-t"), text || "");
        tl.set("#tc-c" + n, { opacity: 1 }, at);
        tl.fromTo("#tc-c" + n + "-l", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at + 0.05);
        BS.reveal(tl, $("tc-c" + n + "-t"), at + 0.1, "rise", { stagger: 0.05, dur: 0.55 });
        BS.marks($("tc-c" + n + "-t")).forEach((p, i) => BS.draw(tl, p, at + 0.9 + i * 0.15, 0.35));
        BS.exit(tl, "#tc-c" + n, out - 0.22, "lift", { dur: 0.2 });
      };
      cap(1, v.beforeLabel || "Önce", v.beforeLine, T.before, T.wipe + 0.2);
      cap(2, v.afterLabel || "Sonra", v.afterLine, T.after - 0.2, T.compare);
      cap(3, v.note || "", v.compareLine, T.compare, T.pay);

      // ---- before: slow scroll + problem chips ------------------------------------
      if (v.imageFit !== "contain") tl.fromTo(".tc-img", { y: 0 }, { y: -140, duration: T.compare - T.before, ease: "sine.inOut" }, T.before);
      const chips = (box, list, glyph, at, out) => {
        BS.list(list)
          .slice(0, 3)
          .forEach((txt, i) => {
            const c = document.createElement("div");
            c.className = "tc-chip";
            c.innerHTML = "<b>" + glyph + "</b>";
            c.appendChild(document.createTextNode(txt));
            box.appendChild(c);
            BS.pop(tl, c, at + i * 0.5, { from: 0.7, dur: 0.38 });
          });
        BS.exit(tl, box, out, "fall", { dur: 0.25 });
      };
      chips($("tc-probs"), v.problems, "✕", T.before + 0.9, T.wipe - 0.3);

      // ---- wipe: the after slides over the before -----------------------------------
      tl.set("#tc-div", { opacity: 1 }, T.wipe);
      tl.fromTo("#tc-div", { x: W }, { x: 0, duration: 0.9, ease: "power3.inOut" }, T.wipe);
      tl.fromTo("#tc-after", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.9, ease: "power3.inOut" }, T.wipe);
      tl.to("#tc-tag-b", { opacity: 0, duration: 0.2 }, T.wipe + 0.4);
      tl.to("#tc-div", { opacity: 0, duration: 0.2 }, T.wipe + 0.9);
      chips($("tc-fixes"), v.fixes, "✓", T.after + 0.9, T.compare - 0.3);

      // ---- compare: divider settles in the middle -------------------------------------
      tl.set("#tc-div", { x: 0 }, T.compare);
      tl.to("#tc-div", { opacity: 1, duration: 0.15 }, T.compare);
      tl.fromTo("#tc-div", { x: 0 }, { x: W * 0.5, duration: 0.7, ease: "power3.out", immediateRender: false }, T.compare + 0.05);
      tl.fromTo("#tc-after", { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 50%)", duration: 0.7, ease: "power3.out", immediateRender: false }, T.compare + 0.05);
      tl.fromTo("#tc-div", { x: W * 0.5 }, { x: W * 0.38, duration: 0.6, ease: "sine.inOut", immediateRender: false }, T.compare + 0.85);
      tl.fromTo("#tc-after", { clipPath: "inset(0% 0% 0% 50%)" }, { clipPath: "inset(0% 0% 0% 38%)", duration: 0.6, ease: "sine.inOut", immediateRender: false }, T.compare + 0.85);
      tl.fromTo(["#tc-tag-b", "#tc-tag-a"], { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.1, immediateRender: false }, T.compare + 0.3);

      // ---- payoff -------------------------------------------------------------------
      tl.set("#tc-pay", { opacity: 1 }, T.pay);
      tl.set("#tc-stage", { opacity: 0 }, T.pay);
      BS.rich($("tc-pa"), v.payoffA || "");
      const pb = $("tc-pb");
      const caret = $("tc-caret");
      BS.rich(pb, v.payoffB || "");
      pb.appendChild(caret);
      BS.reveal(tl, $("tc-pa"), T.pay + 0.06, "rise", { stagger: 0.05 });
      BS.reveal(tl, pb, T.pay + 0.4, "tilt", { stagger: 0.08 });
      BS.blink(clock, caret, T.pay + 0.95, T.end, { before: 0 });
      tl.set("#tc-pay", { opacity: 0 }, T.end);

      // ---- end card + chrome -----------------------------------------------------------
      BS.endcardInto(tl, clock, $("tc-end"), T.end, { cta: v.cta });
      BS.chrome(tl, {
        tag: "#tag",
        handle: "#handle",
