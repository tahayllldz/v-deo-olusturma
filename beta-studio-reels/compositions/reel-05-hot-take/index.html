    <script>
      const tl = gsap.timeline({ paused: true });
      const vars = BS.vars();

      // ---- hook (A/B): three slams on the beat; "yok." gets the red pen -----
      const hook = document.getElementById("hook");
      BS.rich(hook, BS.pick(vars, "hook", "Her işletmenin|mobil uygulamaya|ihtiyacı ~yok.~"));
      const parts = BS.split(hook);
      const lines = BS.$$(".bs-line", hook);
      (lines.length ? lines : [hook]).forEach((line, i) => {
        tl.fromTo(BS.$$(".w", line), { scale: 1.6, opacity: 0, transformOrigin: "0% 80%" }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out", stagger: 0.04 }, [0.1, 0.65, 1.2][i] != null ? [0.1, 0.65, 1.2][i] : 1.2 + (i - 2) * 0.55);
      });
      BS.marks(hook).forEach((p, i) => BS.draw(tl, p, 1.5 + i * 0.15, 0.32));
      tl.to(parts.words, { yPercent: -40, opacity: 0, duration: 0.2, ease: "power2.in", stagger: 0.015 }, 2.42);

      // ---- brand chrome --------------------------------------------------
      BS.chrome(tl, {
        tag: "#tag",
        handle: "#handle",
        ticks: ["#tick1", "#tick2", "#tick3", "#tick4"].map((s) => document.querySelector(s)),
        chapters: [
          [0, 2.609],
          [2.609, 7.174],
          [7.174, 13.696],
          [13.696, 15.652],
        ],
      });
      BS.theme(tl, "#chrome", 3.913, "paper");
      BS.theme(tl, "#chrome", 10.435, "ink");
      tl.to("#chrome", { opacity: 0, duration: 0.2, ease: "power1.in" }, 15.45);

      window.__timelines["main"] = tl;
