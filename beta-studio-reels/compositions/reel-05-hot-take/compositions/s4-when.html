<!doctype html>
<!-- Reel 05 · s4-when (10.435–13.696, local 0–3.261) — when an app DOES make sense.
     The icon from the hook returns — this time the cobalt check, not the red pen. -->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #r5w-root {
          position: absolute;
          inset: 0;
        }
        #r5w-head {
          position: absolute;
          left: 72px;
          top: 320px;
          width: 900px;
        }
        #r5w-head .bs-label {
          margin-bottom: 14px;
        }
        #r5w-h {
          font-size: 100px;
        }
        #r5w-h .bs-serif {
          color: var(--accent-text);
        }
        .r5w-row {
          position: absolute;
          left: 72px;
          width: 860px;
          display: grid;
          grid-template-columns: 96px 1fr;
          gap: 18px;
          align-items: baseline;
        }
        .r5w-row i {
          font-family: var(--bs-font-mono);
          font-style: normal;
          font-weight: 700;
          font-size: 44px;
          color: var(--accent-text);
        }
        .r5w-row b {
          font-family: var(--bs-font-display);
          font-weight: 700;
          font-size: 54px;
          line-height: 1.08;
          letter-spacing: -0.02em;
          color: var(--fg);
        }
        #r5w-icon {
          position: absolute;
          left: 760px;
          top: 1270px;
          width: 170px;
          height: 170px;
          border-radius: 42px;
          background: var(--bs-signal);
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 14px;
          padding: 36px;
          box-sizing: border-box;
        }
        #r5w-icon i {
          display: block;
          border-radius: 12px;
          background: var(--bs-paper);
        }
        #r5w-icon i:nth-child(4) {
          background: rgba(242, 240, 235, 0.45);
        }
        #r5w-ok {
          position: absolute;
          left: 860px;
          top: 1230px;
          width: 110px;
          height: 110px;
        }
      </style>
      <div id="r5w-root" class="bs-scene bs-theme-ink" data-composition-id="r5-when" data-width="1080" data-height="1920">
        <div class="bs-dots"></div>
        <div id="r5w-head">
          <div class="bs-label bs-label--accent">Peki uygulama ne zaman?</div>
          <h2 id="r5w-h" class="bs-hook">Ancak <span class="bs-serif">doğru problem</span> varsa:</h2>
        </div>
        <div id="r5w-r1" class="r5w-row" style="top: 690px"><i>01</i><b>Müşteri sizi haftada birkaç kez kullanıyorsa</b></div>
        <div id="r5w-r2" class="r5w-row" style="top: 880px"><i>02</i><b>Bildirim gerçekten değer katıyorsa</b></div>
        <div id="r5w-r3" class="r5w-row" style="top: 1070px"><i>03</i><b>Kamera, konum gibi telefon özelliği şartsa</b></div>
        <div id="r5w-icon"><i></i><i></i><i></i><i></i></div>
        <div id="r5w-ok"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#r5w-head .bs-label", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.04);
          BS.reveal(tl, document.getElementById("r5w-h"), 0.06, "rise", { stagger: 0.06 });
          const beat = 0.652;
          [1, 2, 3].forEach((i) => {
            tl.fromTo("#r5w-r" + i + " i", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, beat * i);
            BS.reveal(tl, document.querySelector("#r5w-r" + i + " b"), beat * i + 0.04, "rise", { stagger: 0.03, dur: 0.45 });
          });
          BS.pop(tl, "#r5w-icon", 2.45, { from: 0.5, dur: 0.4, ease: "back.out(2)" });
          const ok = BS.pen(document.getElementById("r5w-ok"), "check", { x: 0, y: 0, w: 110, h: 110 }, { fix: true });
          ok.parentNode.style.stroke = "#4cd38a";
          ok.parentNode.style.strokeWidth = "14";
          BS.draw(tl, ok, 2.75, 0.3, "power2.out");
          window.__timelines["r5-when"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
