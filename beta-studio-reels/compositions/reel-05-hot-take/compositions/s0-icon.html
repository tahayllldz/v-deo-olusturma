<!doctype html>
<!-- Reel 05 · s0-icon (0.000–2.609) — under the hook: a generic app icon,
     crossed out by the red pen on the third beat. -->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #r5i-root {
          position: absolute;
          inset: 0;
        }
        #r5i-glow {
          position: absolute;
          left: 240px;
          top: 960px;
          width: 600px;
          height: 600px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(76, 107, 255, 0.3), rgba(10, 12, 22, 0) 100%);
        }
        #r5i-icon {
          position: absolute;
          left: 390px;
          top: 1060px;
          width: 300px;
          height: 300px;
          border-radius: 72px;
          background: var(--bs-signal);
          box-shadow: 0 40px 80px -30px rgba(64, 69, 230, 0.7);
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 26px;
          padding: 64px;
          box-sizing: border-box;
        }
        #r5i-icon i {
          display: block;
          border-radius: 22px;
          background: var(--bs-paper);
        }
        #r5i-icon i:nth-child(4) {
          background: rgba(242, 240, 235, 0.45);
        }
        #r5i-label {
          position: absolute;
          left: 0;
          right: 0;
          top: 1390px;
          text-align: center;
          color: var(--fg-muted);
        }
        #r5i-x {
          position: absolute;
          left: 360px;
          top: 1030px;
          width: 360px;
          height: 360px;
        }
      </style>
      <div id="r5i-root" class="bs-scene bs-theme-ink" data-composition-id="r5-icon" data-width="1080" data-height="1920">
        <div class="bs-dots"></div>
        <div id="r5i-glow" data-layout-ignore></div>
        <div id="r5i-icon"><i></i><i></i><i></i><i></i></div>
        <div id="r5i-label" class="bs-label">uygulamanız</div>
        <div id="r5i-x"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          BS.pop(tl, "#r5i-icon", 0.3, { from: 0.6, dur: 0.5, ease: "back.out(1.8)" });
          BS.fade(tl, "#r5i-label", 0.55, { dur: 0.3 });
          tl.fromTo("#r5i-glow", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "sine.out" }, 0.3);
          const x = BS.pen(document.getElementById("r5i-x"), "cross", { x: 0, y: 0, w: 360, h: 360 }, { seed: 5 });
          x.parentNode.style.strokeWidth = "16";
          BS.draw(tl, x, 1.62, 0.34, "power2.out");
          tl.to("#r5i-icon", { keyframes: { rotation: [0, -4, 3, -2, 0] }, duration: 0.35, ease: "none" }, 1.95);
          tl.to(["#r5i-icon", "#r5i-x", "#r5i-label"], { opacity: 0.0, y: 60, duration: 0.25, ease: "power2.in" }, 2.36);
          window.__timelines["r5-icon"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
