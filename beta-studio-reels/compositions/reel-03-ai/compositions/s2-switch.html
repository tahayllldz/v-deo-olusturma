      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const clock = BS.clock(tl, 1.305);
          BS.pop(tl, "#r3w-switch", 0.04, { from: 0.85, dur: 0.32, ease: "back.out(2)" });
          tl.fromTo("#r3w-label", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.04);
          // the flip (click SFX at local 0.52)

          tl.fromTo("#r3w-fill", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.52);
          tl.to("#r3w-off", { opacity: 0, y: -40, duration: 0.16, ease: "power2.in" }, 0.5);
          tl.fromTo("#r3w-on", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 0.56);
          tl.fromTo("#r3w-bloom", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.75, ease: "power2.out" }, 0.52);
          tl.fromTo("#r3w-channels", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.78);
          BS.blink(clock, document.getElementById("r3w-caret"), 0.7, 1.305, { before: 1 });
          window.__timelines["r3-switch"] = tl;
        })();
