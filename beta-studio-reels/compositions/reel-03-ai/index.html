    <script>
      const tl = gsap.timeline({ paused: true });
      const vars = BS.vars();

      // ---- hook (A/B): calm night — words rise softly, one line per beat ---
      const hook = document.getElementById("hook");
      BS.rich(hook, BS.pick(vars, "hook", "İşletmeniz için|AI kullanmanın|en *basit* yolu bu."));
      const parts = BS.split(hook);
      const lines = BS.$$(".bs-line", hook);
      (lines.length ? lines : [hook]).forEach((line, i) => BS.reveal(tl, line, 0.12 + i * 0.36, "rise", { stagger: 0.06, dur: 0.7 }));
      BS.marks(hook).forEach((p, i) => BS.draw(tl, p, 1.35 + i * 0.15, 0.45));
      tl.to(parts.words, { yPercent: -40, opacity: 0, duration: 0.24, ease: "power2.in", stagger: 0.02 }, 2.38);

      // ---- brand chrome --------------------------------------------------
      BS.chrome(tl, {
        tag: "#tag",
        handle: "#handle",
        ticks: ["#tick1", "#tick2", "#tick3", "#tick4"].map((s) => document.querySelector(s)),
        chapters: [
          [0, 2.609],
          [2.609, 8.478],
          [8.478, 15.652],
          [15.652, 17.609],
        ],
      });
      tl.to("#chrome", { opacity: 0, duration: 0.2, ease: "power1.in" }, 17.41);

      window.__timelines["main"] = tl;
    </script>
