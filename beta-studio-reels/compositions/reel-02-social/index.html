  <body>

      <div id="el-equation" data-composition-id="r2-equation" data-composition-src="compositions/s2-equation.html" data-start="7.222" data-duration="1.667" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="el-funnel" data-composition-id="r2-funnel" data-composition-src="compositions/s3-funnel.html" data-start="8.889" data-duration="5.555" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="el-payoff" data-composition-id="r2-payoff" data-composition-src="compositions/s4-payoff.html" data-start="14.444" data-duration="2.223" data-track-index="1" data-width="1080" data-height="1920"></div>

          <span class="bs-tick"><i id="tick1"></i></span><span class="bs-tick"><i id="tick2"></i></span><span class="bs-tick"><i id="tick3"></i></span><span class="bs-tick"><i id="tick4"></i></span>
        </div>
        <div id="handle" class="bs-handle">@betastudio.cy</div>
      </div>

      <!-- music bed (track 10) — per-reel cut with the fade baked in (music/cuts.json) -->

      <!-- SFX (tracks 11+) -->
      <audio id="sfx-h1" src="system/sfx/whoosh-short.mp3" data-start="0.1" data-duration="0.57" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-h2" src="system/sfx/impact-bass-1.mp3" data-start="1.111" data-duration="1.2" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-rise" src="system/sfx/whoosh.mp3" data-start="2.62" data-duration="0.57" data-track-index="13" data-volume="0.4"></audio>

      <audio id="sfx-f1" src="system/sfx/pop.mp3" data-start="9.11" data-duration="0.72" data-track-index="14" data-volume="0.34"></audio>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const vars = BS.vars();

      // ---- hook (A/B): line by line on the beat --------------------------
      const hook = document.getElementById("hook");
      BS.rich(hook, BS.pick(vars, "hook", "Takipçiniz|çok olabilir.|Ama *müşteriniz?*"));
      const parts = BS.split(hook);
      const lines = BS.$$(".bs-line", hook);
      const beat = 60 / 108;
      (lines.length ? lines : [hook]).forEach((line, i) => {
        const at = i < 2 ? 0.1 + i * 0.28 : 1.111 + (i - 2) * beat;
        BS.reveal(tl, line, at, i < 2 ? "rise" : "slam", { stagger: 0.05, from: 1.35 });
      });
      BS.marks(hook).forEach((p, i) => BS.draw(tl, p, 1.4 + i * 0.15, 0.45));
      tl.to(parts.words, { yPercent: -40, opacity: 0, duration: 0.24, ease: "power2.in", stagger: 0.02 }, 2.5);

      // ---- brand chrome --------------------------------------------------
      BS.chrome(tl, {
        tag: "#tag",
        handle: "#handle",
        ticks: ["#tick1", "#tick2", "#tick3", "#tick4"].map((s) => document.querySelector(s)),
        chapters: [
          [0, 2.778],
          [2.778, 8.889],
          [8.889, 14.444],
          [14.444, 16.667],
        ],
      });
      BS.theme(tl, "#chrome", 7.222, "paper");
      BS.theme(tl, "#chrome", 14.444, "signal");
      tl.to("#chrome", { opacity: 0, duration: 0.2, ease: "power1.in" }, 16.47);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
