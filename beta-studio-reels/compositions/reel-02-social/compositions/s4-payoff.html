<!doctype html>
<!-- Reel 02 · s4-payoff (14.444–16.667, local 0–2.223) — back to the signal field.
     "Takipçi toplamayın. Güven toplayın." -->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #r2y-root {
          position: absolute;
          inset: 0;
        }
        #r2y-ghost {
          left: -60px;
          top: 1080px;
          color: var(--bs-paper);
          opacity: 0.08;
        }
        #r2y-a {
          position: absolute;
          left: 72px;
          top: 620px;
          width: 880px;
          font-size: 92px;
          color: var(--fg-muted);
        }
        #r2y-b {
          position: absolute;
          left: 72px;
          top: 750px;
          width: 980px;
          font-size: 142px;
        }
      </style>
      <div id="r2y-root" class="bs-scene bs-theme-signal" data-composition-id="r2-payoff" data-width="1080" data-height="1920">
        <div class="bs-dots"></div>
        <div id="r2y-ghost" class="bs-ghost" data-layout-ignore>güven</div>
        <h2 id="r2y-a" class="bs-headline">Takipçi toplamayın.</h2>
        <h2 id="r2y-b" class="bs-hook bs-hook--xl"><span class="bs-serif">Güven</span> toplayın.<span id="r2y-caret" class="bs-caret"></span></h2>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const clock = BS.clock(tl, 2.223);
          BS.reveal(tl, document.getElementById("r2y-a"), 0.06, "rise", { stagger: 0.05 });
          BS.reveal(tl, document.getElementById("r2y-b"), 0.56, "tilt", { stagger: 0.09 });
          tl.fromTo("#r2y-ghost", { x: 0 }, { x: -120, duration: 2.2, ease: "none" }, 0);
          BS.blink(clock, document.getElementById("r2y-caret"), 1.05, 2.223, { before: 0 });
          window.__timelines["r2-payoff"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
