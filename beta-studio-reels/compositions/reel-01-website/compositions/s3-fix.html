        <div id="r1f-cursor" class="bs-cursor">
          <svg viewBox="0 0 72 72" aria-hidden="true"><path d="M12 6 L12 58 L25.5 45.5 L35 66 L44.5 61.5 L35 41.5 L53 41.5 Z" fill="#0A0C16" stroke="#F2F0EB" stroke-width="4.5" stroke-linejoin="round" /></svg>
          <span class="bs-ripple" data-layout-ignore></span>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const view = document.getElementById("r1f-view");

          // rebuild: the closed tab comes back, clean
          tl.fromTo("#r1f-browser", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
          tl.fromTo(["#r1f-nav", "#r1f-hero", "#r1f-eyebrow", "#r1f-h", "#r1f-p", "#r1f-cta"], { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out", stagger: 0.06 }, 0.12);
          tl.fromTo("#r1f-head .bs-label", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.05);
          BS.reveal(tl, document.querySelector("#r1f-head .bs-headline"), 0.1, "rise");

          // fix 1 · fast: the load bar completes at once
          tl.fromTo("#r1f-load", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 0.25);
          BS.pop(tl, "#r1f-c1", 0.6, { from: 0.6, ease: "back.out(2.2)", dur: 0.36 });
          BS.draw(tl, BS.pen(view, "underline", { x: 10, y: 6, w: 840, h: 26 }, { fix: true, thin: true, seed: 3 }), 0.6, 0.35);
          // fix 2 · clear: bracket the one-sentence promise
          BS.pop(tl, "#r1f-c2", 1.2, { from: 0.6, ease: "back.out(2.2)", dur: 0.36 });
          BS.draw(tl, BS.pen(view, "bracket", { x: 16, y: 448, w: 40, h: 200 }, { fix: true, thin: true }), 1.2, 0.4);
          // fix 3 · one button: circle the CTA
          BS.pop(tl, "#r1f-c3", 1.8, { from: 0.6, ease: "back.out(2.2)", dur: 0.36 });
          BS.draw(tl, BS.pen(view, "circle", { x: 14, y: 648, w: 640, h: 140 }, { fix: true, seed: 8 }), 1.8, 0.5);

          // customer clicks the CTA (CTA centre ≈ x 400, y 1360 → tip offset 12/6)
          const cursor = document.getElementById("r1f-cursor");
          BS.cursorPath(tl, cursor, [
            { t: 2.0, x: 1010, y: 1760 },
            { t: 2.05, x: 420, y: 1352, dur: 0.5, ease: "power3.out" },
          ]);
          tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.12 }, 2.0);
          BS.click(tl, cursor, 2.6, { target: "#r1f-cta" });
          // the headline zone hands over to the notification (no overlap with the page)
          BS.exit(tl, ["#r1f-head", "#r1f-chips"], 2.8, "lift", { dur: 0.2 });
          BS.drop(tl, "#r1f-notif", 2.95);
          window.__timelines["r1-fix"] = tl;
        })();
      </script>
    </template>
