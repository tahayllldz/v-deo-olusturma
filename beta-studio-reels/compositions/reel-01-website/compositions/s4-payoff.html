<!doctype html>
<!-- Reel 01 · s4-payoff (14.40–16.20, local 0–1.8) — hard cut to the navy stage.
     "Güzel site değil, çalışan site." — the human voice carries "çalışan". -->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #r1y-root {
          position: absolute;
          inset: 0;
        }
        #r1y-glow {
          position: absolute;
          left: -160px;
          top: 520px;
          width: 1100px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(76, 107, 255, 0.28), rgba(139, 92, 246, 0.12) 55%, rgba(10, 12, 22, 0) 100%);
        }
        #r1y-a {
          position: absolute;
          left: 72px;
          top: 640px;
          width: 860px;
          color: var(--fg-muted);
          font-size: 96px;
        }
        #r1y-b {
          position: absolute;
          left: 72px;
          top: 760px;
          width: 900px;
        }
        #r1y-b .bs-serif {
          color: var(--accent-text);
        }
      </style>
      <div id="r1y-root" class="bs-scene bs-theme-ink" data-composition-id="r1-payoff" data-width="1080" data-height="1920">
        <div class="bs-dots"></div>
        <div id="r1y-glow" data-layout-ignore></div>
        <h2 id="r1y-a" class="bs-headline">Güzel site değil,</h2>
        <h2 id="r1y-b" class="bs-hook bs-hook--xl"><span class="bs-serif">çalışan</span> site.<span id="r1y-caret" class="bs-caret"></span></h2>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const clock = BS.clock(tl, 1.8);
          tl.fromTo("#r1y-glow", { scale: 0.7, opacity: 0 }, { scale: 1.05, opacity: 1, duration: 1.8, ease: "sine.out" }, 0);
          BS.reveal(tl, document.getElementById("r1y-a"), 0.08, "rise", { stagger: 0.05 });
          BS.reveal(tl, document.getElementById("r1y-b"), 0.42, "tilt", { stagger: 0.08 });
          BS.blink(clock, document.getElementById("r1y-caret"), 0.9, 1.8, { before: 0 });
          window.__timelines["r1-payoff"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
