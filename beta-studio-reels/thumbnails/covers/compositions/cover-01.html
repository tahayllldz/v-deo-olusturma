<!doctype html>
<!-- Cover 01 — static thumbnail (theme paper). Title markup: *serif* ~pen mark~ | line break. -->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #cv1-root {
          position: absolute;
          inset: 0;
        }
        #cv1-title .bs-serif {
          color: var(--accent-text);
        }
      </style>
      <div id="cv1-root" class="bs-scene bs-theme-paper" data-composition-id="cover-01" data-width="1080" data-height="1920">
        <div class="bs-dots"></div>
        <div class="bs-tag cv-tag"><span class="bs-tag__dot"></span>Bunu Yapma · 01</div>
        <h1 id="cv1-title" class="bs-hook cv-title">Web siteniz|müşteri|~kaçırıyor~|mu?</h1>
        <div id="cv1-art" class="cv-art">
      <div class="bs-browser" style="position:absolute;left:60px;top:40px;width:760px">
        <div class="bs-browser__bar"><div class="bs-browser__dots"><i></i><i></i><i></i></div><div class="bs-browser__url">isletmeniz.com</div><div id="cv1-x" class="bs-browser__close" style="position:relative">×</div></div>
        <div class="bs-browser__view" style="height:240px;background:var(--bs-sheet)"><div style="position:absolute;left:40px;top:40px;width:420px;height:34px;border-radius:12px;background:#e6e3dc"></div><div style="position:absolute;left:40px;top:96px;width:300px;height:24px;border-radius:10px;background:#e6e3dc"></div><div style="position:absolute;left:40px;top:150px;width:200px;height:56px;border-radius:28px;background:#d6d2c8"></div></div>
      </div>
      <div id="cv1-cursor" class="bs-cursor" style="left:744px;top:96px"><svg viewBox="0 0 72 72" aria-hidden="true"><path d="M12 6 L12 58 L25.5 45.5 L35 66 L44.5 61.5 L35 41.5 L53 41.5 Z" fill="#0A0C16" stroke="#F2F0EB" stroke-width="4.5" stroke-linejoin="round" /></svg></div>
        </div>
        <div class="cv-brand">
          <div class="bs-lockup" lang="en"><div class="bs-lockup__beta">BETA<span class="bs-caret"></span></div></div>
          <div class="bs-label" lang="en">@betastudio.cy</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const title = document.getElementById("cv1-title");
          BS.rich(title, title.textContent);
          BS.split(title);
          BS.marks(title).forEach((p) => BS.draw(tl, p, 0, 0.01));
          BS.draw(tl, BS.pen(document.getElementById("cv1-art"), "circle", { x: 676, y: 22, w: 150, h: 120 }, { seed: 3 }), 0, 0.01);
          const brand = window.BS_BRAND || {};
          if (brand.logo) {
            const box = document.querySelector("#cv1-root .bs-lockup");
            box.innerHTML = '<img class="bs-brand-logo" style="width:300px" src="' + brand.logo + '" alt="Beta Studio" />';
          }
          window.__timelines["cover-01"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
