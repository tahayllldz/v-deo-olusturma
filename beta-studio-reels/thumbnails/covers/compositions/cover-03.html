<!doctype html>
<!-- Cover 03 — static thumbnail (theme ink). Title markup: *serif* ~pen mark~ | line break. -->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #cv3-root {
          position: absolute;
          inset: 0;
        }
        #cv3-title .bs-serif {
          color: var(--accent-text);
        }
      </style>
      <div id="cv3-root" class="bs-scene bs-theme-ink" data-composition-id="cover-03" data-width="1080" data-height="1920">
        <div class="bs-dots"></div>
        <div class="bs-tag cv-tag"><span class="bs-tag__dot"></span>AI ile 30 Saniye · 03</div>
        <h1 id="cv3-title" class="bs-hook cv-title">Siz uyurken|kim *cevap*|veriyor?</h1>
        <div id="cv3-art" class="cv-art">
      <div style="position:absolute;left:0;top:0;font-family:var(--bs-font-display);font-weight:300;font-size:170px;letter-spacing:-0.04em;color:var(--bs-paper);font-variant-numeric:tabular-nums">23:47</div>
      <div class="bs-notif" style="position:absolute;left:0;top:200px;width:800px"><div class="bs-notif__icon" style="background:var(--bs-iris)">M</div><div><div class="bs-notif__head"><span>Mesajlar</span><span>şimdi</span></div><div class="bs-notif__title">Ayşe K.</div><div class="bs-notif__body">Merhaba, fiyat ne kadar?</div></div></div>
        </div>
        <div class="cv-brand">
          <div class="bs-lockup" lang="en"><div class="bs-lockup__beta">BETA<span class="bs-caret"></span></div></div>
          <div class="bs-label" lang="en">@betastudio.cy</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const title = document.getElementById("cv3-title");
          BS.rich(title, title.textContent);
          BS.split(title);
          BS.marks(title).forEach((p) => BS.draw(tl, p, 0, 0.01));
          const brand = window.BS_BRAND || {};
          if (brand.logo) {
            const box = document.querySelector("#cv3-root .bs-lockup");
            box.innerHTML = '<img class="bs-brand-logo" style="width:300px" src="' + brand.logo + '" alt="Beta Studio" />';
          }
          window.__timelines["cover-03"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
