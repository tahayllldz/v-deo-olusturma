<!doctype html>
<!-- Cover 02 — static thumbnail (theme signal). Title markup: *serif* ~pen mark~ | line break. -->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #cv2-root {
          position: absolute;
          inset: 0;
        }
        #cv2-title .bs-serif {
          color: var(--accent-text);
        }
      </style>
      <div id="cv2-root" class="bs-scene bs-theme-signal" data-composition-id="cover-02" data-width="1080" data-height="1920">
        <div class="bs-dots"></div>
        <div class="bs-tag cv-tag"><span class="bs-tag__dot"></span>Dijital Gerçekler · 02</div>
        <h1 id="cv2-title" class="bs-hook cv-title">Takipçi çok.|Müşteri|*nerede?*</h1>
        <div id="cv2-art" class="cv-art">
      <div style="position:absolute;left:0;top:30px;display:flex;gap:26px">
        <div class="bs-metric" style="width:430px"><span class="bs-metric__label">Takipçi</span><span class="bs-metric__value" style="font-size:110px">48.900</span></div>
        <div id="cv2-sale" class="bs-metric" style="width:300px;position:relative"><span class="bs-metric__label">Satış</span><span class="bs-metric__value" style="font-size:110px;color:#ff8a70">0</span></div>
      </div>
        </div>
        <div class="cv-brand">
          <div class="bs-lockup" lang="en"><div class="bs-lockup__beta">BETA<span class="bs-caret"></span></div></div>
          <div class="bs-label" lang="en">@betastudio.cy</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const title = document.getElementById("cv2-title");
          BS.rich(title, title.textContent);
          BS.split(title);
          BS.marks(title).forEach((p) => BS.draw(tl, p, 0, 0.01));
          BS.draw(tl, BS.pen(document.getElementById("cv2-sale"), "circle", { x: -6, y: 46, w: 190, h: 150 }, { seed: 9 }), 0, 0.01);
          const brand = window.BS_BRAND || {};
          if (brand.logo) {
            const box = document.querySelector("#cv2-root .bs-lockup");
            box.innerHTML = '<img class="bs-brand-logo" style="width:300px" src="' + brand.logo + '" alt="Beta Studio" />';
          }
          window.__timelines["cover-02"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
