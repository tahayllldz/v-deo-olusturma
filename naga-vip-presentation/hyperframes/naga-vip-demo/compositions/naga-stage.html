                        <svg data-hf-id="hf-d78i" width="27" height="13" viewBox="0 0 27 13"><rect data-hf-id="hf-zfa7" x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45" /><rect data-hf-id="hf-i3va" x="2.5" y="2.5" width="16" height="8" rx="2" fill="currentColor" /><rect data-hf-id="hf-hnx9" x="25" y="4.5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5" /></svg>
                      </span>
                    </div>
                    <div data-hf-id="hf-78cx" class="home-indicator"></div>
                  </div>
                  <div data-hf-id="hf-5lr3" class="tap" id="tap1" style="left: 195px; top: 565px"></div>
                  <div data-hf-id="hf-2phb" class="tap" id="tap2" style="left: 195px; top: 782px"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const T = (globalTime) => globalTime - 2; // film time -> this scene's local time
      // ---------- Phone arrives (2.2 – 3.4) ----------
      tl.fromTo("#phone", { y: 760, scale: 1.12, rotation: -5 }, { y: 0, scale: 1, rotation: 0, duration: 1.2, ease: "power3.out" }, T(2.25));
      tl.fromTo("#brand-corner", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, T(2.6));
      tl.fromTo("#demo-flag", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, T(2.7));

      // ---------- Captions: in-up, out-up ----------
      const CAPS = [
        ["#cap0", 2.75, 4.45],
        ["#cap1", 4.6, 6.45],
        ["#cap2", 6.6, 8.85],
        ["#cap3", 9.0, 11.05],
        ["#cap4", 11.2, 12.55],
        ["#cap5", 12.7, 15.0],
      ];
      CAPS.forEach(([sel, tin, tout]) => {
        tl.fromTo(`${sel} .cap__num`, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T(tin));
        tl.fromTo(`${sel} .cap__title`, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, T(tin + 0.06));
        tl.fromTo(`${sel} .cap__sub`, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, T(tin + 0.16));
        tl.fromTo(sel, { opacity: 1, y: 0 }, { opacity: 0, y: -36, duration: 0.3, ease: "power2.in", immediateRender: false }, T(tout));
      });
      tl.fromTo("#progress", { opacity: 0 }, { opacity: 1, duration: 0.4 }, T(4.6));
      [4.6, 6.6, 9.0, 11.2, 12.7].forEach((t, i) => {
        tl.fromTo(`#pg${i + 1}`, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, T(t + 0.1));
      });

      // ---------- Home: tap "İşlem Oluştur" (3.8 – 4.6) ----------
      tl.fromTo("#home-cta", { scale: 1 }, { scale: 0.95, duration: 0.12, ease: "power1.in" }, T(3.95));
      tl.fromTo("#home-cta", { scale: 0.95 }, { scale: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, T(4.07));
      tl.fromTo("#tap1", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.14, ease: "power2.out" }, T(3.92));
      tl.fromTo("#tap1", { scale: 1, opacity: 1 }, { scale: 1.8, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, T(4.06));

      // Screen 1 -> 2 (lateral slide, chrome persists)
      tl.fromTo("#scr-home", { x: 0, opacity: 1 }, { x: -130, opacity: 0, duration: 0.55, ease: "power3.inOut" }, T(4.3));
      tl.fromTo("#scr-res", { x: 400 }, { x: 0, duration: 0.55, ease: "power3.inOut" }, T(4.3));

      // ---------- Step 1: currency (4.6 – 6.6) ----------
      tl.fromTo("#ring-pair", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, T(4.95));
      tl.fromTo("#ring-pair", { opacity: 1 }, { opacity: 0, duration: 0.35, immediateRender: false }, T(6.45));

      // ---------- Step 2: amount types in, estimate counts up (6.6 – 9.0) ----------
      // Discrete text states (seek-safe: the visible text is a pure function of time)
      const AMOUNT = [
        { t: 0, text: "0" },
        { t: 6.95, text: "1" },
        { t: 7.13, text: "10" },
        { t: 7.31, text: "100" },
        { t: 7.49, text: "1.000" },
        { t: 7.67, text: "10.000" },
      ];
      const EST_START = 7.75;
      const EST_DUR = 0.9;
      const EST_VALUE = 649500;
      const fmt = (n) => "₺" + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const textAt = (seq, t) => {
        for (let i = seq.length - 1; i >= 0; i--) if (t >= seq[i].t) return seq[i].text;
        return seq[0].text;
      };
      const amtEl = document.getElementById("amt");
      const estEl = document.getElementById("est");
      const driver = { t: 2 };
      tl.fromTo(
        driver,
        { t: 2 },
        {
          t: 15.9, // driver.t carries film time, so the text states read in film seconds
          duration: 13.9,
          ease: "none",
          onUpdate: () => {
            const t = driver.t;
            amtEl.textContent = textAt(AMOUNT, t);
            const p = Math.min(1, Math.max(0, (t - EST_START) / EST_DUR));
            const eased = 1 - Math.pow(1 - p, T(3));
            estEl.textContent = fmt(Math.round((EST_VALUE * eased) / 100) * 100);
          },
        },
        0,
      );
      tl.fromTo("#est", { scale: 1 }, { scale: 1.08, duration: 0.18, ease: "power2.out", transformOrigin: "100% 50%" }, T(EST_START + EST_DUR - 0.05));
      tl.fromTo("#est", { scale: 1.08 }, { scale: 1, duration: 0.3, ease: "back.out(2)", transformOrigin: "100% 50%", immediateRender: false }, T(EST_START + EST_DUR + 0.13));
      tl.fromTo("#st2", { backgroundColor: "#26262e" }, { backgroundColor: "#cfa752", duration: 0.3 }, T(6.7));
      tl.fromTo("#st3", { backgroundColor: "#26262e" }, { backgroundColor: "#cfa752", duration: 0.3 }, T(9.1));
      tl.fromTo("#st4", { backgroundColor: "#26262e" }, { backgroundColor: "#cfa752", duration: 0.3 }, T(10.4));
      tl.fromTo("#st5", { backgroundColor: "#26262e" }, { backgroundColor: "#cfa752", duration: 0.3 }, T(11.3));

      // ---------- Step 3: branch + time (9.0 – 11.2) ----------
      tl.fromTo("#br-ph", { opacity: 1 }, { opacity: 0, duration: 0.2 }, T(9.35));
      tl.fromTo("#br-val", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, T(9.4));
      tl.fromTo("#br-chk", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(2.4)" }, T(9.5));
      tl.fromTo("#chip-on", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, T(10.05));
      tl.fromTo("#tm-ph", { opacity: 1 }, { opacity: 0, duration: 0.2 }, T(10.2));
      tl.fromTo("#tm-val", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, T(10.25));
      tl.fromTo("#tm-chk", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(2.4)" }, T(10.35));

      // ---------- Step 4: press "Rezervasyon Oluştur" + micro push-in (11.2 – 12.7) ----------
      tl.fromTo("#tap2", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.14, ease: "power2.out" }, T(11.45));
      tl.fromTo("#tap2", { scale: 1, opacity: 1 }, { scale: 1.8, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, T(11.59));
      tl.fromTo("#res-btn", { scale: 1 }, { scale: 0.95, duration: 0.12, ease: "power1.in" }, T(11.48));
      tl.fromTo("#res-btn", { scale: 0.95 }, { scale: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, T(11.6));
      tl.fromTo("#res-lbl", { opacity: 1 }, { opacity: 0, duration: 0.15 }, T(11.62));
      tl.fromTo("#res-load", { opacity: 0 }, { opacity: 1, duration: 0.15 }, T(11.7));
      tl.fromTo("#spinner", { rotation: 0 }, { rotation: 540, duration: 0.95, ease: "none" }, T(11.7));
      tl.fromTo("#phone", { scale: 1 }, { scale: 1.035, duration: 0.5, ease: "power2.out", immediateRender: false }, T(11.5));

      // Screen 2 -> 3
      tl.fromTo("#scr-res", { x: 0, opacity: 1 }, { x: -130, opacity: 0, duration: 0.55, ease: "power3.inOut", immediateRender: false }, T(12.55));
      tl.fromTo("#scr-done", { x: 400 }, { x: 0, duration: 0.55, ease: "power3.inOut" }, T(12.55));
      tl.fromTo("#phone", { scale: 1.035 }, { scale: 1, duration: 0.7, ease: "power2.inOut", immediateRender: false }, T(12.6));

      // ---------- Step 5: confirmation (12.7 – 15.3) ----------
      const ring = document.getElementById("ring-draw");
      const check = document.getElementById("check-draw");
      const RING_LEN = 2 * Math.PI * 46;
      const CHECK_LEN = Math.hypot(11, 11) + Math.hypot(23, T(24)); // fixed path geometry
      ring.style.strokeDasharray = `${RING_LEN}`;
      check.style.strokeDasharray = `${CHECK_LEN}`;
      tl.fromTo(ring, { strokeDashoffset: RING_LEN }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, T(12.95));
      tl.fromTo(check, { strokeDashoffset: CHECK_LEN }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, T(13.45));
      tl.fromTo("#done-title", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T(13.3));
      tl.fromTo("#done-code", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, T(13.55));
      ["#kv1", "#kv2", "#kv3", "#kv4", "#kv5"].forEach((sel, i) => {
        tl.fromTo(sel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, T(13.7 + i * 0.08));
      });
      tl.fromTo("#done-msg", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, T(14.15));

      // Naga side: the reservation lands on the panel, NEW -> PREPARING
      tl.fromTo("#panel-card", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T(13.35));
      tl.fromTo("#pc-new", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.85, duration: 0.2, ease: "power2.in" }, T(14.35));
      tl.fromTo("#pc-prep", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, T(14.45));
      tl.fromTo("#panel-card", { opacity: 1, y: 0 }, { opacity: 0, y: 30, duration: 0.3, ease: "power2.in", immediateRender: false }, T(15.0));

      // ---------- Exit + outro (15.0 – 18.0) ----------
      tl.fromTo("#phone-pos", { opacity: 1, y: 0 }, { opacity: 0, y: 90, duration: 0.55, ease: "power2.in" }, T(15.0));
      tl.fromTo(["#brand-corner", "#demo-flag", "#progress"], { opacity: 1 }, { opacity: 0, duration: 0.35, immediateRender: false }, T(15.05));
      window.__timelines["naga-stage"] = tl;
    })();
  </script>
</template>
