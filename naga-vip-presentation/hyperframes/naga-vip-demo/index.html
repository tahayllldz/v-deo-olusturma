      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0d; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Manrope", sans-serif; color: #f4efe4; }
      .full { position: absolute; inset: 0; }
      /* Scene roots fill the frame; title + outro centre their content */
      [data-composition-id="naga-bg"], [data-composition-id="naga-stage"] { position: absolute; inset: 0; }
      [data-composition-id="naga-title"], [data-composition-id="naga-outro"] { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .frame-center { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .mono { background: url("assets/brand/naga-monogram.svg") center / contain no-repeat; }

      /* Background */

      .glow { position: absolute; width: 1300px; height: 1300px; left: 650px; top: -110px; border-radius: 50%; background: radial-gradient(circle, rgba(207, 167, 82, 0.2) 0%, rgba(207, 167, 82, 0.06) 38%, rgba(207, 167, 82, 0) 66%); }

      .tc-line { margin-top: 30px; font-family: "Fraunces", serif; font-weight: 300; font-size: 54px; letter-spacing: -0.02em; color: #efe8da; max-width: 1300px; line-height: 1.15; }
      .tc-foot { margin-top: 44px; font-size: 22px; font-weight: 700; letter-spacing: 0.18em; color: #9a9386; }

      .progress { position: absolute; left: 0; top: 0; width: 420px; display: flex; gap: 8px; }
      .progress span { position: relative; flex: 1; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      .progress span i { position: absolute; inset: 0; display: block; background: #cfa752; border-radius: 3px; }
      .cap { position: absolute; left: 0; top: 46px; width: 800px; }
      .cap__num { font-size: 22px; font-weight: 800; letter-spacing: 0.22em; color: #d9b56a; }
      .cap__title { margin-top: 18px; font-family: "Fraunces", serif; font-weight: 300; font-size: 82px; line-height: 1.04; letter-spacing: -0.025em; color: #f4efe4; }
      .cap__sub { margin-top: 24px; font-size: 30px; font-weight: 600; line-height: 1.35; color: #c3bcae; max-width: 720px; }
      .cap__sub b { color: #f1da9c; font-weight: 800; }

      /* Mini Naga panel card */
      #panel-card { position: absolute; left: 150px; top: 730px; width: 700px; border-radius: 24px; padding: 22px 26px; background: #f6f2e9; color: #121216; }
      .pc-head { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 800; letter-spacing: 0.16em; color: #6b655a; }
      .pc-head img { height: 26px; }
      .pc-row { margin-top: 16px; display: flex; align-items: center; gap: 22px; font-size: 26px; font-weight: 800; }
      .pc-row .t { font-size: 30px; }
      .pc-row .c { font-size: 21px; font-weight: 700; color: #4a463f; white-space: nowrap; }
      .pc-vip { display: inline-grid; place-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: linear-gradient(135deg, #f1da9c, #cfa752 48%, #a9823a); font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #17130a; margin-left: 6px; vertical-align: 3px; }

      .pc-prep { color: #9a5d08; background: rgba(229, 166, 64, 0.24); }

      #phone-pos { position: absolute; left: 1086px; top: 63px; width: 414px; height: 868px; }

      .scr { position: absolute; inset: 0; overflow: hidden; }
      .scr .app__body { top: 54px; }
      .chrome { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
      .tap { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 3px solid #f1da9c; background: rgba(241, 218, 156, 0.18); z-index: 50; }
      .swap { position: relative; display: block; height: 20px; }
      .swap > span { position: absolute; left: 0; top: 0; white-space: nowrap; }
      .muted { color: #9a9488; }
      .chip-wrap { position: relative; }
      .chip-on { position: absolute; inset: -1px; border-radius: 13px; border: 1px solid #cfa752; background: rgba(207, 167, 82, 0.16); color: #f1da9c; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
      .focus-ring { position: absolute; inset: -6px; border-radius: 26px; border: 2px solid rgba(241, 218, 156, 0.85); box-shadow: 0 0 0 6px rgba(207, 167, 82, 0.14); }
      .btn-label { position: relative; display: grid; place-items: center; width: 100%; height: 100%; }
      .btn-label > span { position: absolute; display: flex; align-items: center; gap: 10px; }
      .spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(23, 19, 10, 0.25); border-top-color: #17130a; }
      .done-ring svg { display: block; }

      .demo-flag { position: absolute; right: 64px; top: 52px; display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 700; color: #9a9386; letter-spacing: 0.04em; }
